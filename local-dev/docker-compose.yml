services:
  db:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openai_pass}
      POSTGRES_DB: ${POSTGRES_DB:-openai_proxy}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openai} -d ${POSTGRES_DB:-openai_proxy}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  app:
    build:
      context: ../
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8082"
    env_file:
      - ./app.env
    environment:
      # Ensure the app connects to the compose db service
      DATABASE_HOST: db
      DATABASE_USERNAME: ${POSTGRES_USER:-openai}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-openai_pass}
      DATABASE_NAME: ${POSTGRES_DB:-openai_proxy}
      # Provide a full connection string for tools that prefer it.
      DATABASE_PATH: "postgresql://${POSTGRES_USER:-openai}:${POSTGRES_PASSWORD:-openai_pass}@db/${POSTGRES_DB:-openai_proxy}?sslmode=disable"
      RUST_LOG: "DEBUG"
    volumes:
      # Keep DB migrations and editable DB schema available to the container
      - ../db:/app/db:ro
      # Expose the public static files so you can edit them locally
      - ../public:/app/public:rw

  next:
    image: node:20
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./app.env
    environment:
      # Ensure Next binds publicly so Docker port mapping works.
      NODE_ENV: development
      PORT: "3000"
      # Auth.js needs this to correctly scope CSRF cookies in local Docker setups.
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      # Auth.js (NextAuth v5) requires a secret even in development.
      # This is a dev-only value; if you want a stable/custom secret, set `AUTH_SECRET` in `local-dev/app.env`.
      AUTH_SECRET: ${AUTH_SECRET:-dev_auth_secret}
    working_dir: /app
    volumes:
      # Bind-mount source for day-to-day dev (HMR).
      - ../app:/app:rw
      # Keep dependencies stable across container restarts.
      - next_node_modules:/app/node_modules
    command: >
      sh -c '
        set -e

        export DATABASE_URL="postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db/$$POSTGRES_DB?sslmode=disable"
        export ZITADEL_ISSUER="$$ISSUER"
        export ZITADEL_CLIENT_ID="$$CLIENT_ID"
        export ZITADEL_CLIENT_SECRET="$$CLIENT_SECRET"

        if [ ! -f node_modules/next/package.json ]; then
          npm ci
        fi

        npm run dev -- --hostname 0.0.0.0 --port 3000
      '

volumes:
  next_node_modules:
